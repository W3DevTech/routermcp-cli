name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/search/**"]
  workflow_dispatch:

jobs:
  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title for WIP
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -qi "WIP"; then
            echo "::error::PR title contains 'WIP'. Please remove 'WIP' from the title when ready for review."
            exit 1
          fi
          echo "PR title check passed: $PR_TITLE"

  test:
    runs-on: ubuntu-latest
    needs: [pr-title-check]
    if: always() && (needs.pr-title-check.result == 'success' || needs.pr-title-check.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build
